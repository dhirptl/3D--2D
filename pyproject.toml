[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "football-3d2d"
version = "0.1.0"
description = "YOLO-Seg football player tracking with team classification"
requires-python = ">=3.10"
dependencies = [
    "ultralytics>=8.3.114",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "PyYAML>=6.0",
    "lap>=0.5.12",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
