# Detection model training configuration
# Used by train.py

model_name: yolo11m.pt
data: data/combined_dataset/data.yaml
name: run_v1_fv2_motaf

epochs: 100
batch: 8
imgsz: 1280
device: mps
freeze: 10
patience: 40

# Augmentation
mosaic: 1.0
mixup: 0.15
fliplr: 0.5
hsv_h: 0.015
hsv_s: 0.7
scale: 0.7
translate: 0.1
